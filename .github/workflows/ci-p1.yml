name: P1 Production Verification

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: backend/package-lock.json }
      - name: Install backend
        working-directory: backend
        run: npm ci
      - name: Prisma generate
        working-directory: backend
        run: npx prisma generate
        env: { DATABASE_URL: postgresql://u:p@localhost:5432/db }
      - name: Test
        working-directory: backend
        run: npm test -- --runInBand --passWithNoTests
        env:
          DATABASE_URL: postgresql://u:p@localhost:5432/db
          JWT_ACCESS_SECRET: ci-test-secret-min-32-characters!!
          JWT_REFRESH_SECRET: ci-test-refresh-secret-32-chars!!
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
      - name: Build
        working-directory: backend
        run: npm run build
        env: { DATABASE_URL: postgresql://u:p@localhost:5432/db }
      - name: Production Docker build
        working-directory: backend
        run: docker build -t loss-defender-pro-backend:p1 .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.44.4", channel: stable, cache: true }
      - name: Dependencies
        working-directory: frontend
        run: flutter pub get
      - name: Analyze
        working-directory: frontend
        run: flutter analyze
      - name: Tests
        working-directory: frontend
        run: flutter test
      - name: Web build
        working-directory: frontend
        run: flutter build web --release
      - name: Production Flutter image build
        working-directory: frontend
        run: docker build -t loss-defender-pro-frontend:p1 .

  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production compose
        run: docker compose -f infra/docker-compose.prod.yml config
      - name: Validate Nginx config
        run: docker run --rm -v "$PWD/infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine nginx -t
