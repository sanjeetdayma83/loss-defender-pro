name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install root (workspaces) or backend
        run: |
          if [ -f package-lock.json ]; then npm ci; else cd backend && npm ci; fi
      - name: Prisma generate
        working-directory: backend
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://u:p@localhost:5432/db
      - name: Unit tests
        working-directory: backend
        run: npm test -- --passWithNoTests
        env:
          DATABASE_URL: postgresql://u:p@localhost:5432/db
          JWT_ACCESS_SECRET: ci-test-secret-min-32-characters!!
          JWT_REFRESH_SECRET: ci-test-refresh-secret-32-chars!!
      - name: Build
        working-directory: backend
        run: npm run build
        env:
          DATABASE_URL: postgresql://u:p@localhost:5432/db
          JWT_ACCESS_SECRET: ci-test-secret-min-32-characters!!
          JWT_REFRESH_SECRET: ci-test-refresh-secret-32-chars!!
