name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
        working-directory: .
      - name: Prisma generate
        run: npx prisma generate
        working-directory: backend
        env:
          DATABASE_URL: postgresql://u:p@localhost:5432/db
      - name: Build
        run: npm run build
        working-directory: backend
        env:
          DATABASE_URL: postgresql://u:p@localhost:5432/db
          JWT_ACCESS_SECRET: ci-test-secret-min-32-characters!!
          JWT_REFRESH_SECRET: ci-test-refresh-secret-32-chars!!
