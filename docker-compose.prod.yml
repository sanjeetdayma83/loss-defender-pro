# Production compose — Neon for DB (no local postgres)
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    # Do NOT publish 6379 to the host in production
    networks:
      - internal

  backend:
    build: ./backend
    env_file: ./backend/.env
    ports: ["3000:3000"]
    depends_on: [redis]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
    networks:
      - internal

networks:
  internal:
    driver: bridge
# Frontend web: build → serve via infra/nginx
