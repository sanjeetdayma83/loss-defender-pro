# Production compose — Neon for DB (no local postgres)
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: ./backend/.env
    ports: ["3000:3000"]
    depends_on: [redis]
    restart: unless-stopped
    environment:
      NODE_ENV: production

# Frontend: build web → serve via infra/nginx
